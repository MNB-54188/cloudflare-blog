#:schema node_modules/wrangler/config-schema.json
# ─────────────────────────────────────────────────────────────
# Cloudflare Workers 部署配置
# 部署命令：npx wrangler deploy
# ─────────────────────────────────────────────────────────────

name = "cloudflare-blog"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 静态资源（CSS / favicon / robots.txt）由 Workers Static Assets 直接返回，
# 未命中的路径才会进入 src/index.js 的路由逻辑。
[assets]
directory = "./public"

# ── D1 数据库绑定 ──────────────────────────────────────────────
# 1) 执行 `npx wrangler d1 create blog-db` 创建数据库
# 2) 把命令输出的 database_id 粘贴到下面
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# ── 环境变量 ──────────────────────────────────────────────────
# 下面这些是可选项，不填也能跑（会话密钥会在首次初始化时自动生成并存入 D1）
[vars]
# SITE_NAME = "墨记"
# SETUP_TOKEN = "换成一串随机字符，用于保护 /setup 初始化页面"

# 本地开发时把敏感变量写在 .dev.vars 里（不要提交到 Git）
